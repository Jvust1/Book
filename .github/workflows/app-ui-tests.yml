name: Book App UI tests

on:
  push:
    paths:
      - "app/**"
      - "app_tests/**"
      - "runtime/**"
      - "courses/**"
      - "library/**"
      - ".github/workflows/app-ui-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "app_tests/**"
      - "runtime/**"
      - "courses/**"
      - "library/**"
      - ".github/workflows/app-ui-tests.yml"

permissions:
  contents: read

jobs:
  app-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install App API dependencies
        run: python -m pip install -r app/api/requirements.txt

      - name: Run App service and API tests
        run: python -m unittest app_tests.test_api app_tests.test_app_service tests.test_source_resolver -v
