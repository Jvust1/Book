name: Book App UI tests

on:
  push:
    paths:
      - "book_core/**"
      - "app/**"
      - "app_tests/**"
      - "runtime/**"
      - "courses/**"
      - "library/**"
      - "books/functional-analysis/**"
      - "tests/**"
      - "course_package/**"
      - "schemas/course-package/**"
      - "tools/compile_course_package.py"
      - "tools/validate_course_package.py"
      - "tools/check_architecture_fitness.py"
      - "tools/check_runtime_readiness.py"
      - "tests/golden/**"
      - ".github/workflows/course-package-fast.yml"
      - ".github/workflows/course-package-heavy.yml"
      - ".github/workflows/app-ui-tests.yml"
  pull_request:
    paths:
      - "book_core/**"
      - "app/**"
      - "app_tests/**"
      - "runtime/**"
      - "courses/**"
      - "library/**"
      - "books/functional-analysis/**"
      - "tests/**"
      - "course_package/**"
      - "schemas/course-package/**"
      - "tools/compile_course_package.py"
      - "tools/validate_course_package.py"
      - "tools/check_architecture_fitness.py"
      - "tools/check_runtime_readiness.py"
      - "tests/golden/**"
      - ".github/workflows/course-package-fast.yml"
      - ".github/workflows/course-package-heavy.yml"
      - ".github/workflows/app-ui-tests.yml"

permissions:
  contents: read

jobs:
  app-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install App API dependencies
        run: python -m pip install -r app/api/requirements.txt

      - name: Run full Runtime regression discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check canonical Functional Analysis runtime readiness
        run: python tools/check_runtime_readiness.py books/functional-analysis

      - name: Run App service, API, source, search, QA and StudyRecord tests
        run: python -m unittest app_tests.test_openai_compatible_provider app_tests.test_qa_provider_factory app_tests.test_qa_service app_tests.test_qa_api app_tests.test_api app_tests.test_api_live app_tests.test_app_service app_tests.test_study_repository app_tests.test_study_service app_tests.test_study_api tests.test_source_resolver tests.test_search_runtime tests.test_qa_provider tests.test_qa_evidence tests.test_qa_runtime -v

      - name: Run full App regression discovery
        run: python -m unittest discover -s app_tests -p "test_*.py" -v

  web-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Typecheck web app
        run: npm run typecheck

      - name: Build web app
        run: npm run build

  browser-acceptance:
    runs-on: ubuntu-latest
    needs: [app-api, web-client]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install App API dependencies
        run: python -m pip install -r app/api/requirements.txt

      - name: Install web dependencies
        working-directory: app/web
        run: npm ci

      - name: Install Chromium
        working-directory: app/web
        run: npx playwright install --with-deps chromium

      - name: Start local API with deterministic QA and StudyRecord storage
        env:
          BOOK_QA_PROVIDER: fake
          BOOK_APP_DATA_DIR: /tmp/book-app-data
        run: |
          rm -rf /tmp/book-app-data
          mkdir -p /tmp/book-app-data
          nohup python -m uvicorn app.api.main:app --host 127.0.0.1 --port 8000 > /tmp/book-api.log 2>&1 < /dev/null &
          echo $! > /tmp/book-api.pid

      - name: Start Vite web app
        working-directory: app/web
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/book-vite.log 2>&1 < /dev/null &
          echo $! > /tmp/book-vite.pid

      - name: Wait for local services
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null && curl -fsS http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Local services did not become ready"
          cat /tmp/book-api.log || true
          cat /tmp/book-vite.log || true
          exit 1

      - name: Run real browser acceptance
        working-directory: app/web
        run: npm run e2e

      - name: Upload synthetic reader preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-reader-previews
          path: app/web/test-results/pdfjs-pilot-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            app/web/playwright-report
            app/web/test-results
          if-no-files-found: ignore
          retention-days: 7