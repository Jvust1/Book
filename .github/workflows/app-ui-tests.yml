name: Book App UI tests

on:
  push:
    paths:
      - "app/**"
      - "app_tests/**"
      - ".github/workflows/app-ui-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "app_tests/**"
      - ".github/workflows/app-ui-tests.yml"

permissions:
  contents: read

jobs:
  app-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install DTO dependency
        run: python -m pip install "pydantic>=2,<3"

      - name: Run App service tests
        run: python -m unittest app_tests.test_app_service -v
