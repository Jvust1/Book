name: One-command original reader launcher

on:
  push:
    paths:
      - 'tools/run_reader_pilot.py'
      - 'tools/verify_reader_pilot_launcher.py'
      - 'tests/test_reader_pilot_launcher.py'
      - 'tools/build_reader_pilot_source.py'
      - 'app/**'
      - 'app_tests/synthetic*'
      - 'requirements-extras/**'
      - '.github/workflows/reader-pilot-launcher.yml'
  pull_request:
    paths:
      - 'tools/run_reader_pilot.py'
      - 'tools/verify_reader_pilot_launcher.py'
      - 'tests/test_reader_pilot_launcher.py'
      - 'tools/build_reader_pilot_source.py'
      - 'app/**'
      - 'app_tests/synthetic*'
      - 'requirements-extras/**'
      - '.github/workflows/reader-pilot-launcher.yml'

permissions:
  contents: read
concurrency:
  group: reader-pilot-launcher-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  launch-extracted-original-reader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Check launcher contracts and clean source extraction
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest tests.test_reader_pilot_launcher tests.test_reader_pilot_source -v
          $pilot = Join-Path $env:RUNNER_TEMP 'book one command original sample'
          if (Test-Path -LiteralPath $pilot) { throw 'Fresh extraction required' }
          $head = git rev-parse HEAD
          python tools/build_reader_pilot_source.py build --ref "$head" --output .build/launcher-source.tar.gz
          python tools/build_reader_pilot_source.py extract .build/launcher-source.tar.gz "$pilot"
          "PILOT_DIR=$pilot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Explicit one-command setup and self-check from extracted source
        working-directory: ${{ env.PILOT_DIR }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          python tools/run_reader_pilot.py --setup --check
          python -c "from pathlib import Path; assert not any(Path(p).exists() for p in ('books','courses','library','.git','.env'))"
      - name: Install the existing pinned Chromium test browser
        working-directory: ${{ env.PILOT_DIR }}/app/web
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($IsWindows) {
            node node_modules/@playwright/test/cli.js install chromium
          } else {
            node node_modules/@playwright/test/cli.js install --with-deps chromium
          }
      - name: Verify real launch to page and owned signal cleanup
        working-directory: ${{ env.PILOT_DIR }}
        env:
          BOOK_RUN_LAUNCHER_ACCEPTANCE: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/verify_reader_pilot_launcher.py
