name: Android Recorder

on:
  push:
    branches:
      - design/android-recorder-mvp-20260830
    paths:
      - 'android-recorder/**'
      - '.github/workflows/android-recorder.yml'
  pull_request:
    paths:
      - 'android-recorder/**'
      - '.github/workflows/android-recorder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: book-recorder-debug-apk
          path: android-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
