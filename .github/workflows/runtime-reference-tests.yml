name: Runtime reference tests

on:
  push:
    paths:
      - "runtime/**"
      - "tools/check_runtime_readiness.py"
      - "tools/rebuild_runtime_artifacts.py"
      - "tools/recover_functional_analysis_search.py"
      - "tools/recover_functional_analysis_page_map.py"
      - "tests/**"
      - ".github/workflows/runtime-reference-tests.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "tools/check_runtime_readiness.py"
      - "tools/rebuild_runtime_artifacts.py"
      - "tools/recover_functional_analysis_search.py"
      - "tools/recover_functional_analysis_page_map.py"
      - "tests/**"
      - ".github/workflows/runtime-reference-tests.yml"

permissions:
  contents: write

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile reference runtime
        run: |
          python -m py_compile runtime/book_runtime.py
          python -m py_compile tools/check_runtime_readiness.py
          python -m py_compile tools/rebuild_runtime_artifacts.py
          python -m py_compile tools/recover_functional_analysis_search.py

      - name: Run unit tests
        run: python -m unittest tests.test_book_runtime tests.test_functional_analysis_page_map -v

      - name: Rebuild audited Functional Analysis candidates
        if: matrix.python-version == '3.13'
        run: |
          python tools/rebuild_runtime_artifacts.py books/functional-analysis --toc
          python tools/recover_functional_analysis_search.py books/functional-analysis --promote-safe
          python -c "import json,pathlib,shutil; root=pathlib.Path('books/functional-analysis'); t=json.loads((root/'toc_bilingual.json.candidate').read_text(encoding='utf-8')); r=json.loads((root/'search_index_v0_36.rebuild_report.json').read_text(encoding='utf-8')); assert t.get('chapter_count') == 8 and t.get('section_count') == 132; assert r.get('record_count') == 1493 and r.get('promotable_by_count_and_anchor') is True; shutil.copyfile(root/'toc_bilingual.json.candidate', root/'toc_bilingual.json'); print(json.dumps({'chapter_count':t.get('chapter_count'),'section_count':t.get('section_count'),'search_record_count':r.get('record_count'),'expected_search_record_count':r.get('expected_record_count'),'search_all_unique':r.get('all_unique'),'missing_anchor_count':len(r.get('without_source_anchor') or []),'search_promotable':r.get('promotable_by_count_and_anchor')},ensure_ascii=False,indent=2))"

      - name: Upload audited recovery candidates
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: functional-analysis-runtime-candidates
          path: |
            books/functional-analysis/toc_bilingual.json.candidate
            books/functional-analysis/search_index_v0_36.jsonl.candidate
            books/functional-analysis/search_index_v0_36.rebuild_report.json
          if-no-files-found: error

      - name: Commit validated Search and TOC artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/runtime-final-index-recovery' && matrix.python-version == '3.13'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            books/functional-analysis/search_index_v0_36.jsonl \
            books/functional-analysis/toc_bilingual.json \
            books/functional-analysis/search_index_v0_36.rebuild_report.json
          if git diff --cached --quiet; then
            echo "Validated artifacts already match branch."
          else
            git commit -m "Book: restore audited Functional Analysis search and TOC"
            git push origin HEAD:fix/runtime-final-index-recovery
          fi
