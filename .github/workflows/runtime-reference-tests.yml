name: Runtime reference tests

on:
  push:
    paths:
      - "runtime/**"
      - "tools/check_runtime_readiness.py"
      - "tools/rebuild_runtime_artifacts.py"
      - "tests/**"
      - ".github/workflows/runtime-reference-tests.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "tools/check_runtime_readiness.py"
      - "tools/rebuild_runtime_artifacts.py"
      - "tests/**"
      - ".github/workflows/runtime-reference-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile reference runtime
        run: |
          python -m py_compile runtime/book_runtime.py
          python -m py_compile tools/check_runtime_readiness.py
          python -m py_compile tools/rebuild_runtime_artifacts.py

      - name: Run unit tests
        run: python -m unittest tests.test_book_runtime -v
