name: Runtime reference tests

on:
  push:
    paths:
      - "runtime/**"
      - "tools/check_runtime_readiness.py"
      - "tools/rebuild_runtime_artifacts.py"
      - "tools/recover_functional_analysis_search.py"
      - "tools/recover_functional_analysis_page_map.py"
      - "tools/normalize_functional_analysis_runtime_identities.py"
      - "tools/normalize_functional_analysis_figure_ids.py"
      - "books/functional-analysis/chunk_*_structure.json"
      - "tests/**"
      - ".github/workflows/runtime-reference-tests.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "tools/check_runtime_readiness.py"
      - "tools/rebuild_runtime_artifacts.py"
      - "tools/recover_functional_analysis_search.py"
      - "tools/recover_functional_analysis_page_map.py"
      - "tools/normalize_functional_analysis_runtime_identities.py"
      - "tools/normalize_functional_analysis_figure_ids.py"
      - "books/functional-analysis/chunk_*_structure.json"
      - "tests/**"
      - ".github/workflows/runtime-reference-tests.yml"

permissions:
  contents: write

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile reference runtime
        run: |
          python -m py_compile runtime/book_runtime.py
          python -m py_compile tools/check_runtime_readiness.py
          python -m py_compile tools/rebuild_runtime_artifacts.py
          python -m py_compile tools/recover_functional_analysis_search.py
          python -m py_compile tools/recover_functional_analysis_page_map.py
          python -m py_compile tools/normalize_functional_analysis_runtime_identities.py
          python -m py_compile tools/normalize_functional_analysis_figure_ids.py

      - name: Reduce structure diff noise against main
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/runtime-final-index-recovery' && matrix.python-version == '3.13'
        run: |
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- \
            books/functional-analysis/chunk_006a_structure.json \
            books/functional-analysis/chunk_011a_structure.json \
            books/functional-analysis/chunk_011b_structure.json \
            books/functional-analysis/chunk_014a_structure.json
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "books/functional-analysis/chunk_006a_structure.json": [
                  (
                      '"name_zh":"L^p(R) 上的后续练习（跨批次继续）"',
                      '"name_zh":"Poisson 核卷积在 L^p 中的压缩性与近似恒等性"',
                  ),
              ],
              "books/functional-analysis/chunk_011a_structure.json": [
                  (
                      '"name_en":"infinite Bernoulli space X"',
                      '"name_en":"infinite Bernoulli space X=Z_2^∞"',
                  ),
              ],
              "books/functional-analysis/chunk_011b_structure.json": [
                  (
                      '{"figure":"Figure 1","title_zh":"Rademacher 函数 r_1 与 r_2","pdf_page":212',
                      '{"id":"Figure 1@pdf:212","figure":"Figure 1","title_zh":"Rademacher 函数 r_1 与 r_2","pdf_page":212',
                  ),
                  (
                      '{"figure":"Figure 2","title_zh":"Gaussian 积分的矩形和近似","pdf_page":217',
                      '{"id":"Figure 2@pdf:217","figure":"Figure 2","title_zh":"Gaussian 积分的矩形和近似","pdf_page":217',
                  ),
              ],
              "books/functional-analysis/chunk_014a_structure.json": [
                  (
                      '"name_zh":"Brownian 路径的 Hölder 正则性与非光滑性"',
                      '"name_zh":"Brownian 路径的 Hölder 正则性与粗糙性"',
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected patch source missing in {name}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Normalize known cross-batch stable identities
        run: |
          python tools/normalize_functional_analysis_runtime_identities.py books/functional-analysis --write
          python tools/normalize_functional_analysis_figure_ids.py books/functional-analysis --write

      - name: Run unit tests
        run: python -m unittest tests.test_book_runtime tests.test_functional_analysis_page_map tests.test_continuation_integrity tests.test_runtime_object_merge tests.test_functional_analysis_identity_normalizer tests.test_functional_analysis_figure_normalizer -v

      - name: Rebuild and validate Functional Analysis runtime artifacts
        if: matrix.python-version == '3.13'
        run: |
          python tools/rebuild_runtime_artifacts.py books/functional-analysis --toc
          python tools/recover_functional_analysis_search.py books/functional-analysis --promote-safe
          python tools/recover_functional_analysis_page_map.py books/functional-analysis --promote-safe
          python -c "import json,pathlib,shutil; root=pathlib.Path('books/functional-analysis'); t=json.loads((root/'toc_bilingual.json.candidate').read_text(encoding='utf-8')); s=json.loads((root/'search_index_v0_36.rebuild_report.json').read_text(encoding='utf-8')); p=json.loads((root/'page_map.rebuild_report.json').read_text(encoding='utf-8')); assert t.get('chapter_count') == 8 and t.get('section_count') == 132; assert s.get('record_count') == 1493 and s.get('promotable_by_count_and_anchor') is True; assert p.get('row_count') == 442 and p.get('anchor_checks_pass') is True; shutil.copyfile(root/'toc_bilingual.json.candidate', root/'toc_bilingual.json')"
          python tools/check_runtime_readiness.py books/functional-analysis --write
          python -c "import json,pathlib; from runtime.book_runtime import BookRuntime; root=pathlib.Path('books/functional-analysis'); r=json.loads((root/'RUNTIME_READINESS.json').read_text(encoding='utf-8')); assert r.get('status') == 'READY', r; runtime=BookRuntime.open(root); assert runtime.is_ready; assert runtime.page_map_row(20).get('printed_page') == '1'; assert runtime.page_map_row(442).get('printed_page') == '423'; print(json.dumps({'runtime_status':r.get('status'),'book_runtime_open':True,'figure_count':len(runtime.figures),'missing_required_files':r.get('missing_required_files'),'stale_files':r.get('stale_files'),'identity_mismatches':r.get('identity_mismatches')},ensure_ascii=False,indent=2))"

      - name: Upload audited recovery candidates
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: functional-analysis-runtime-candidates
          path: |
            books/functional-analysis/toc_bilingual.json.candidate
            books/functional-analysis/search_index_v0_36.jsonl.candidate
            books/functional-analysis/search_index_v0_36.rebuild_report.json
            books/functional-analysis/page_map.csv.candidate
            books/functional-analysis/page_map.rebuild_report.json
            books/functional-analysis/RUNTIME_READINESS.json
          if-no-files-found: error

      - name: Commit validated runtime artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/runtime-final-index-recovery' && matrix.python-version == '3.13'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            books/functional-analysis/chunk_*_structure.json \
            books/functional-analysis/search_index_v0_36.jsonl \
            books/functional-analysis/toc_bilingual.json \
            books/functional-analysis/page_map.csv \
            books/functional-analysis/search_index_v0_36.rebuild_report.json \
            books/functional-analysis/page_map.rebuild_report.json \
            books/functional-analysis/RUNTIME_READINESS.json
          if git diff --cached --quiet; then
            echo "Validated runtime artifacts already match branch."
          else
            git commit -m "Book: minimize runtime structure diff and preserve READY"
            git push origin HEAD:fix/runtime-final-index-recovery
          fi
